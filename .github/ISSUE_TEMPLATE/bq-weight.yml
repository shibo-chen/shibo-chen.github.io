name: 体重记录 / Weight tracker
description: 只记录日期和体重，不需要填写完整训练日志。
title: "[BQ Weight] 体重记录"
body:
  - type: markdown
    attributes:
      value: |
        记录会公开显示在 [BQ 日志](https://shibo-chen.github.io/zh/journal/) 的体重 tracker。请使用 shibo-chen 账号。
        单位为 lbs（磅），数字最多保留两位小数。同一天更正时，编辑原记录即可。已有 kg 记录会自动换算显示。
  - type: input
    id: date
    attributes:
      label: 日期 / Date
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: input
    id: weight
    attributes:
      label: 体重 / Weight (lbs)
      placeholder: "例如 173.1"
    validations:
      required: true
  - type: input
    id: note
    attributes:
      label: 备注 / Note
      placeholder: 例如晨起、跑后（可选）
